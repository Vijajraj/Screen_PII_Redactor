name: Phase 1 CI -- Tests, Linting, and Type Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==================================================================
  # GATE 1: Linting and Syntax Checks (fast, no models needed)
  # ==================================================================
  lint:
    name: Ruff Lint + Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Lint Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ==================================================================
  # GATE 2: Type Checking (no models needed)
  # ==================================================================
  typecheck:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run MyPy
        run: mypy pii_classifier.py inference_wrapper.py --ignore-missing-imports

  # ==================================================================
  # GATE 3: Unit Tests (classifier only, no ONNX models needed)
  # ==================================================================
  unit-tests:
    name: Unit Tests (Classifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis

      - name: Run Unit Tests
        run: |
          pytest tests/test_pii_classifier.py tests/test_unit_verhoeff.py tests/test_unit_luhn.py tests/test_unit_classifier.py -v

  # ==================================================================
  # GATE 4: Property-Based Tests (classifier only, no ONNX models)
  # ==================================================================
  property-tests:
    name: Property-Based Tests (Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis

      - name: Run Property Tests
        run: |
          pytest tests/test_property.py -v --tb=short

  # ==================================================================
  # GATE 5: Integration, System, and Acceptance Tests
  #          (requires ONNX models -- only runs if models are present)
  # ==================================================================
  full-tests:
    name: Full Test Suite (Integration + System + Acceptance)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis huggingface-hub

      - name: Download Models
        run: python setup_models.py

      - name: Run Full Test Suite
        run: pytest tests -v --tb=short

      - name: Run Pipeline Evaluation
        run: python evaluate_pipeline.py
